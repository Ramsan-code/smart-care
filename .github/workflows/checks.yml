name: Smart Care checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-only-ephemeral
          MARIADB_DATABASE: smartcare
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      DJANGO_SECRET_KEY: ci-only-ephemeral-not-a-production-secret
      DJANGO_DEBUG: 'true'
      DEMO_MODE: 'true'
      DB_NAME: smartcare
      DB_USER: root
      DB_PASSWORD: ci-only-ephemeral
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_CACHE_URL: redis://127.0.0.1:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test --noinput
